[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idps"
version = "0.1.0"
description = "Indoor Drone Positioning System - central software"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
drones = ["pymavlink>=2.4.40"]
ui = ["PySide6-Essentials>=6.6", "matplotlib>=3.8", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]
mac-app = ["PySide6-Essentials>=6.6", "matplotlib>=3.8", "pyinstaller>=6.6", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]
dev = ["pytest>=8", "matplotlib>=3.8", "PySide6-Essentials>=6.6", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]

[project.scripts]
idps-plan = "idps.plan.cli:main"
idps-sim = "idps.sim.cli:main"
idps-show = "idps.show.cli:main"

[project.gui-scripts]
idps-dashboard = "idps.ui.app:main"

[tool.setuptools.packages.find]
include = ["idps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
