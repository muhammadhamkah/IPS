# 8 x 8 m show floor around the show origin, 5.5 m ceiling: the 5-drone choreography (examples/shows).
name: Show floor 8 x 8 m
origin: {xy: [0, 0], north_deg: 90}   # North up the plan (drawing +Y), East to the right
volume: {min: [-4, -4, 0], max: [4, 4, 5.5]}
sensor: OV9281
lenses_mm: [2.8, 3.6]
requirements: {min_cameras: 3, p95_mm: 10, noise: tight}
design: {min_cameras: 4, p95_mm: 7}
visibility: {max_range_m: 15}
evaluation: {spacing_m: 0.75, inset_m: 0.25}
trusses: []
tripod_zones:
  - {id: north, rect: [-5, 4.5, 5, 5.0], height_m: [5.5, 6.5]}
  - {id: south, rect: [-5, -5.0, 5, -4.5], height_m: [5.5, 6.5]}
  - {id: east,  rect: [4.5, -4, 5.0, 4], height_m: [5.5, 6.5]}
  - {id: west,  rect: [-5.0, -4, -4.5, 4], height_m: [5.5, 6.5]}
no_go_zones: []
pads:                     # charging pads along the South edge, 1 m apart, 4 drones each (idps/show/pads.py)
  centres: [[-2, -3.2], [-1, -3.2], [0, -3.2], [1, -3.2], [2, -3.2]]   # plan x, y (= E, N here)
  slot_spacing_m: 0.2
  layers_m: [1, 2, 3, 4]
  batch_gap_s: 5
  hold_timeout_s: 60
  climb_speed_mps: 1.5
  transfer_speed_mps: 1.5
candidates:
  tripod_step_m: 1.0
  tripod_heights_m: [6.0]
  tripod_elevations_deg: [-45, -30, -15]
  azimuth_step_deg: 30
  max_cameras_per_mount: 1
optimiser: {max_cameras: 30}
