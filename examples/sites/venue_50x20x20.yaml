# Typical venue: 50 m long (X) x 20 m deep (Y) x 20 m high. The volume is drawn
# as floor vertices (V0..V3) and extruded to 20 m. Origin (calibration square)
# at the floor centre, +X along the long side.
name: Venue 50 x 20 x 20 m
origin: {xy: [0, 0], north_deg: 0}   # calibration square at the floor centre; North along the long side
volume:
  polygon: [[-25, -10], [25, -10], [25, 10], [-25, 10]]   # V0, V1, V2, V3 (edge Ek: Vk -> Vk+1)
  z: [0, 20]
sensor: OV9281
lenses_mm: [2.8, 3.6]

requirements: {min_cameras: 3, p95_mm: 10, noise: tight}
design: {min_cameras: 4, p95_mm: 7}

visibility: {max_range_m: 80}
evaluation: {spacing_m: [5, 5, 4], inset_m: 0.5}

trusses:                            # rigging lines above the volume
  - {id: T1, start: [-27, -6], end: [27, -6], height_m: 21.5}
  - {id: T2, start: [-27, 6], end: [27, 6], height_m: 21.5, usable: [[0, 20], [34, 54]]}   # gap over the stage

tripod_zones:
  - id: perimeter                   # strip 1-3 m outside every edge; masts at the 20 m ceiling (cameras above the drones)
    offset_m: [1, 3]
    height_m: [2, 20]

no_go_zones:
  - [[-4, -14], [4, -14], [4, -10.5], [-4, -10.5]]     # audience entrance on edge E0

candidates:
  truss_step_m: 3
  truss_elevations_deg: [-90, -60, -35]
  tripod_step_m: 3
  tripod_heights_m: [20]
  tripod_elevations_deg: [0, -15, -30, -50]
  azimuth_step_deg: 30
  max_cameras_per_mount: 3

optimiser: {max_cameras: 120}
