# Show hall: 100 x 100 x 30 m flight volume. Overhead trusses at 31.5 m every
# 12.5 m, one with a missing section and one extra truss line. Cameras are always
# above the drones, so with a 30 m ceiling tripods (masts up to 20 m) cannot be
# used: trusses only.
name: Show hall (example)
volume: {min: [-50, -50, 0], max: [50, 50, 30]}
sensor: OV9281
lenses_mm: [2.8]

requirements:
  min_cameras: 3
  p95_mm: 10
  noise: tight

design:                   # what the optimiser aims for: margin for occlusion / a lost camera
  min_cameras: 4
  p95_mm: 7

visibility: {max_range_m: 120}
evaluation: {spacing_m: [10, 10, 5], inset_m: 1.0}

trusses:
  - {id: T1, start: [-55, -50], end: [55, -50], height_m: 31.5}
  - {id: T2, start: [-55, -37.5], end: [55, -37.5], height_m: 31.5}
  - {id: T3, start: [-55, -25], end: [55, -25], height_m: 31.5}
  - {id: T4, start: [-55, -12.5], end: [55, -12.5], height_m: 31.5}
  - {id: T5, start: [-55, 0], end: [55, 0], height_m: 31.5, usable: [[0, 40], [70, 110]]}  # 30 m gap
  - {id: T6, start: [-55, 12.5], end: [55, 12.5], height_m: 31.5}
  - {id: T7, start: [-55, 25], end: [55, 25], height_m: 31.5}
  - {id: T8, start: [-55, 37.5], end: [55, 37.5], height_m: 31.5}
  - {id: T9, start: [-55, 50], end: [55, 50], height_m: 31.5}
  - {id: X1, start: [0, -55], end: [0, 55], height_m: 32.0}      # additional (hired) truss line


candidates:
  truss_step_m: 5
  truss_drop_m: 0.3
  truss_elevations_deg: [-90, -60, -35]
  azimuth_step_deg: 30
  max_cameras_per_mount: 3

optimiser: {max_cameras: 400}
