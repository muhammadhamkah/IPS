# Charging pads for the 8 x 8 m show floor (examples/sites/show_8x8.yaml): 5 pads in a row along
# the South edge, 1 m centre to centre, 4 drones each (2 x 2, 0.2 m apart). Drone ID =
# 4 x (pad - 1) + slot; slot = take-off batch. See idps/show/pads.py.
pads:              # centres, venue N and E (m)
  - [-3.2, -2.0]
  - [-3.2, -1.0]
  - [-3.2,  0.0]
  - [-3.2,  1.0]
  - [-3.2,  2.0]
slot_spacing_m: 0.2
layers_m: [4, 3, 2, 1]       # grid heights in the initial and final grid: batch 1 (first up) the highest
batch_gap_s: 5                # at 1.5 m/s climb and transfer: the smallest safe gap (idps-show check)
hold_timeout_s: 60
climb_speed_mps: 1.5
transfer_speed_mps: 1.5
