# The 5-drone choreography (examples/shows/five_drones_sphere_square.py) over the 8 x 8 m show
# floor's 11 planned cameras, as used for the closed loop with PX4 (px4/sitl/run_loop.sh).
name: Show floor 8 x 8 m
plan: ../plans/show_8x8.yaml      # camera layout from idps-plan (paths relative to this file)
duration_s: 20
seed: 1
camera_model: {sensor: OV9281, fps: 60, exposure_us: 500, peak_at_10m: 232, threshold_dn: 20}
timing: {sync: ptp, jitter_sigma_us: 5, clock_profile: pi5_ptp_hw}
network: {loss: 0.001, latency_ms: 2, jitter_ms: 1}
calibration_error: {rot_mrad: 0.05, pos_mm: 1}
markers: {chip_rate_hz: 30, high: 1.0, low: 0.4, body_radius_m: 0.06}   # 60 g quad: 65 mm frame + props
drones: []
