# The planned prototype network: every camera on its own Raspberry Pi 3B, each Pi wired
# by Ethernet cable (the Pi 3B's port is 100 Mbit) into one gigabit switch, the PC on the same switch receiving the
# observations and computing drone positions. Clocks are kept in step with PTP using
# software timestamps (ptp4l -S), simulated message by message (idps.sim.clocksync);
# clocks.csv in the output shows each Pi's true clock error and what ptp4l reports.
# Compare with lab_pi3b_wifi.yaml (free-running, Wi-Fi) and lab_three_drones.yaml.
name: Lab - Pi 3B stations, wired, software PTP
plan: ../plans/lab.yaml
duration_s: 20
seed: 1

camera_model: {sensor: OV9281_640x400, fps: 120, exposure_us: 500, peak_at_10m: 60, threshold_dn: 20,
               proc_latency_ms: 8}
timing: {sync: ptp, jitter_sigma_us: 15, clock_profile: pi3b_ptp_sw, clock_start: synced}
network: {loss: 0.0005, latency_ms: 0.4, jitter_ms: 0.2}      # gigabit switch, 100 Mbit Pi links
calibration_error: {rot_mrad: 0.1, pos_mm: 2}

drones:
  - {id: 1, marker_id: 17, trajectory: {type: hover, position: [0, 0, 1.0]}}
  - {id: 2, marker_id: 42, trajectory: {type: circle, center: [0, 0, 1.5], radius: 2.0, speed: 2.0, z_amplitude: 0.5}}
  - {id: 3, marker_id: 99, trajectory: {type: line, start: [-2.5, -2, 2], end: [2.5, 2, 2], speed: 4.0}}
